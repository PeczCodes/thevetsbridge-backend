version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    container_name: vetsbridge-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: theVetsBridgeDB
    ports:
      - '5444:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: vetsbridge-redis
    ports:
      - '6379:6379'
    command: redis-server --requirepass R2D3S
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
